[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-borel"
version = "0.9.0"
description = "Exact sparse Borel characteristic maps and classical and exceptional generators for SageMath"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Sean Rogers"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/sean-rogers-t/Sage-programs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sage_borel = ["data/*.json"]
